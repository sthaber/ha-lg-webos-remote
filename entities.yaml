# LG webOS TV YAML remote — Home Assistant package.
#
# Provides read+write controls for settings the built-in `webostv`
# integration doesn't surface: power saving step, screen on/off, eye
# comfort mode, HDMI input. State is mirrored from the TV by a small
# polling script, which also carries out the settings writes.
#
# Install: see https://github.com/sthaber/ha-lg-webos-remote
#
# Two things you may want to edit:
#   1. `entity_id: media_player.lg_webos_tv` (used throughout) — change if
#      your TV's media_player entity_id differs.
#   2. `hdmi_inputs` under `template:` — the names to show for each HDMI
#      port. Switching goes by port number, so the TV renaming its inputs
#      (it takes names from connected devices) doesn't break anything.

# Settings writes go through tv.py, not the `webostv.command` service. The
# TV rejects setSystemSettings from ordinary clients, so tv.py runs the
# write as a luna:// call attached to a notification alert, which takes two
# requests. See tv.py for detail.
shell_command:
  lg_webos_tv_set: 'python3 /config/ha-lg-webos-remote/tv.py set {{ category }} {{ key }} {{ value }}'

command_line:
  - sensor:
      name: LG webOS TV State
      unique_id: lg_webos_tv_state
      command: 'python3 /config/ha-lg-webos-remote/tv.py'
      command_timeout: 4
      scan_interval: 5
      value_template: "{{ value_json.energy_saving | default('unknown') }}"
      json_attributes:
        - power_state
        - eye_comfort_mode
        - hdmi_port
        - error

template:
  - variables:
      # HDMI port number for each name shown in HA. Edit to match what's
      # plugged in; leave out empty ports.
      hdmi_inputs:
        PS5: 1
        Apple TV: 2
        Switch 2: 3
    select:
      - name: LG webOS TV Power Saving Step
        unique_id: lg_webos_tv_power_saving_step
        icon: mdi:leaf
        availability: >-
          {{ state_attr('sensor.lg_webos_tv_state','power_state') is not none }}
        options: "{{ ['Auto', 'Off', 'Minimum', 'Medium', 'Maximum'] }}"
        state: >-
          {{ {'auto':'Auto','off':'Off','min':'Minimum','med':'Medium','max':'Maximum'}.get(states('sensor.lg_webos_tv_state'), '') }}
        select_option:
          - action: shell_command.lg_webos_tv_set
            data:
              category: picture
              key: energySaving
              value: >-
                {{ {'Auto':'auto','Off':'off','Minimum':'min','Medium':'med','Maximum':'max'}[option] }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.lg_webos_tv_state
      - name: LG webOS TV HDMI Input
        unique_id: lg_webos_tv_hdmi_input
        icon: mdi:hdmi-port
        availability: >-
          {{ state_attr('sensor.lg_webos_tv_state','power_state') is not none }}
        options: "{{ hdmi_inputs | list }}"
        # Blank when an app or an unlisted port is showing.
        state: >-
          {% set port = state_attr('sensor.lg_webos_tv_state','hdmi_port') %}
          {%- for name, p in hdmi_inputs.items() if p == port %}{{ name }}{% endfor %}
        select_option:
          - action: webostv.command
            data:
              entity_id: media_player.lg_webos_tv
              command: tv/switchInput
              payload:
                inputId: "HDMI_{{ hdmi_inputs[option] }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.lg_webos_tv_state
  - switch:
      - name: LG webOS TV Screen
        unique_id: lg_webos_tv_screen
        icon: mdi:television
        availability: >-
          {{ state_attr('sensor.lg_webos_tv_state','power_state') is not none }}
        state: >-
          {{ state_attr('sensor.lg_webos_tv_state','power_state') == 'Active' }}
        # Screen on/off needs CONTROL_TV_SCREEN, which the TV still grants
        # to the built-in integration, so these stay on webostv.command.
        turn_on:
          - action: webostv.command
            continue_on_error: true
            data:
              entity_id: media_player.lg_webos_tv
              command: com.webos.service.tvpower/power/turnOnScreen
        turn_off:
          - action: webostv.command
            continue_on_error: true
            data:
              entity_id: media_player.lg_webos_tv
              command: com.webos.service.tvpower/power/turnOffScreen
      - name: LG webOS TV Eye Comfort Mode
        unique_id: lg_webos_tv_eye_comfort_mode
        icon: mdi:weather-night
        availability: >-
          {{ state_attr('sensor.lg_webos_tv_state','eye_comfort_mode') is not none }}
        state: >-
          {{ state_attr('sensor.lg_webos_tv_state','eye_comfort_mode') == 'on' }}
        turn_on:
          - action: shell_command.lg_webos_tv_set
            data:
              category: picture
              key: eyeComfortMode
              value: 'on'
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.lg_webos_tv_state
        turn_off:
          - action: shell_command.lg_webos_tv_set
            data:
              category: picture
              key: eyeComfortMode
              value: 'off'
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.lg_webos_tv_state
